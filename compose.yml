# Restricted profile: the agent works in /workspace as an unprivileged user
# (uid 1000), with the container root filesystem mounted read-only. This is the
# profile to prefer, and the one `docker compose up -d` starts as is.
#
# Defaults chosen so that it runs with no editing at all:
#   - image pulled from GHCR (public: no authentication needed to pull it)
#   - port published on 127.0.0.1 only: reachable from this machine
#   - workspace in a named Docker volume, so the host needs no preparation
#
# Hardening: read-only rootfs plus tmpfs, no-new-privileges, cap_drop ALL,
# resource limits, non-root user. Details in SECURITY.md.
#
# There is no `command:` block any more. The image entrypoint
# (/opt/cloudium/gateway/start.mjs) starts the runtime on 127.0.0.1:3131 with
# --no-token, merges the browser MCP server into the agent configuration, and
# serves the published port 3030 through the authentication gateway.

services:
  z-cloudium:
    image: ghcr.io/sigma-gigachad/z-cloudium:latest
    # To pin a version instead of following `latest`:
    # image: ghcr.io/sigma-gigachad/z-cloudium:3.14.4
    container_name: z-cloudium
    restart: unless-stopped
    stop_grace_period: 20s

    ## Unprivileged user, as in the image. Deliberately redundant.
    user: "1000:1000"

    ports:
      # 127.0.0.1 = reachable from this machine only. To reach it from another
      # machine of the private network, replace it with that machine's IP:
      #   "10.10.100.50:3030:3030"
      # Never write "3030:3030" (every interface).
      - "127.0.0.1:3030:3030"

    volumes:
      # /data holds the authentication accounts and the session key (auth/), the
      # API key, the settings, the skills and the agent configuration. Without
      # this volume every container recreation starts from a fresh installation
      # and the setup wizard runs again.
      # Docker initializes the volume with the uid 1000 of /data in the image.
      - z-cloudium-data:/data
      # Workspace: a named volume by default, so `docker compose up -d` works
      # without preparation. To work on real files, comment this line out and
      # mount a host directory instead (after `chown 1000:1000` on the host,
      # since the container runs as uid 1000):
      #   - /srv/z-cloudium/workspace:/workspace
      - z-cloudium-workspace:/workspace

    environment:
      # HOME and ZCODE_DATA_BASE_DIR both point at /data: the skills
      # ($HOME/.zcode/skills), the memories, the agent configuration
      # ($HOME/.zcode/cli/config.json) and the web settings live in the volume,
      # so they persist.
      HOME: /data
      ZCODE_DATA_BASE_DIR: /data
      ZCODE_SERVER_WORKSPACE: /workspace
      ZCODE_MODEL_TELEMETRY_ENABLED: "0"

      # Authentication gateway on the published port: a password plus a TOTP
      # code, and the setup wizard on the first connection. Setting
      # ZCLOUDIUM_AUTH=off publishes the runtime directly, without any
      # authentication, which is only acceptable on a trusted network.
      ZCLOUDIUM_AUTH: "on"
      # Browser automation through the MCP server baked into the image. "off"
      # leaves the agent configuration untouched.
      ZCLOUDIUM_BROWSER_MCP: "on"
      # The browser panel: the agent's browser with a live view, a viewport
      # control, and the keyboard and the mouse, served on /_browser/ behind
      # this session. On by default, because that browser is the point of the web
      # build; "off" restores the previous shape, where no browser is started for
      # the panel and nothing observable changes. Whoever holds a session holds
      # that browser, sessions and cookies included, so read the panel section of
      # SECURITY.md before exposing this port to anyone else. It also needs
      # ZCLOUDIUM_BROWSER_MCP.
      # ZCLOUDIUM_BROWSER_PANEL: "off"
      # TLS terminated by the gateway, with a self-signed certificate it generates
      # on first start. Turn it on when nothing in front terminates TLS, and
      # declare the address you browse to, or the browser refuses the certificate
      # even after accepting the warning. Leave it off behind a reverse proxy.
      # ZCLOUDIUM_TLS: "on"
      # ZCLOUDIUM_TLS_HOSTS: "192.168.1.20,nas.local"
      # How long a session lasts, in hours. 12 by default, which is also the
      # window during which a stolen cookie stays usable: raise it only with
      # that in mind. Any value that is not a positive number falls back to 12.
      ZCLOUDIUM_SESSION_TTL_HOURS: "12"
      # Leave this off unless a reverse proxy in front of the container
      # overwrites x-forwarded-for: with it on, the failure block is keyed on a
      # header the client can set, which is the same as having no block at all.
      # With it off (the default) the block is keyed on the connecting socket,
      # and every client behind the Docker port mapping shares one key.
      # ZCLOUDIUM_TRUST_PROXY: "off"

    ## ---------- Hardening ----------
    # The container root filesystem cannot be modified: a compromise does not
    # persist, and the image tooling (node, git, chromium) cannot be altered
    # from the inside. The gateway only writes into the /data volume, which is
    # why this keeps working. Legitimate writes go to /data, /workspace and /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    # Prevents any elevation through a setuid binary or a file capability, which
    # is also what makes Chromium's setuid sandbox helper unusable (see
    # SECURITY.md for the consequence, it is stated there and not hidden).
    security_opt:
      - no-new-privileges:true
    # No capability: uid 1000 needs none for its work.
    cap_drop:
      - ALL
    # Resource guards (adjust to the machine). Browser automation adds a handful
    # of Chromium processes and its own memory; raise pids_limit and mem_limit if
    # a heavy page hits them.
    pids_limit: 512
    mem_limit: 4g
    cpus: 2

    # With ZCLOUDIUM_AUTH=off there is no gateway, and the probe above falls
    # through to the web app. Uncomment this to probe the runtime instead:
    # healthcheck:
    #   test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3030/api/server-info').then(r=>process.exit(r.ok||r.status===401?0:1)).catch(()=>process.exit(1))\""]
    #   interval: 30s
    #   timeout: 5s
    #   start_period: 20s
    #   retries: 3

volumes:
  z-cloudium-data:
  z-cloudium-workspace:
