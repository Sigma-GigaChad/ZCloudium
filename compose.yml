# Profil restreint : l'agent travaille dans /workspace, en utilisateur non
# privilégié (uid 1000), avec le rootfs du conteneur en lecture seule.
# C'est le profil à préférer, et celui que `docker compose up -d` lance tel quel.
#
# Défauts choisis pour fonctionner sans aucune édition :
#   - image tirée de GHCR (voir README pour l'authentification, le paquet est privé)
#   - port exposé sur 127.0.0.1 uniquement : accessible depuis cette machine
#   - workspace dans un volume Docker nommé, donc aucun droit à préparer sur l'hôte
#
# Durcissement : rootfs read-only + tmpfs, no-new-privileges, cap_drop ALL,
# limites de ressources, utilisateur non-root. Détail dans SECURITY.md.

services:
  z-cloudium:
    image: ghcr.io/sigma-gigachad/z-cloudium:latest
    # Pour épingler une version au lieu de suivre `latest` :
    # image: ghcr.io/sigma-gigachad/z-cloudium:3.14.3
    container_name: z-cloudium
    restart: unless-stopped
    stop_grace_period: 20s

    ## Utilisateur non privilégié, comme dans l'image. Redondant volontairement.
    user: "1000:1000"

    ports:
      # 127.0.0.1 = joignable depuis cette machine seulement. Pour y accéder depuis
      # une autre machine du réseau privé, remplacer par l'IP de la machine :
      #   "10.10.100.50:3030:3030"
      # Ne jamais écrire "3030:3030" (toutes les interfaces, sans authentification).
      - "127.0.0.1:3030:3030"

    volumes:
      # /data : clé API, réglages, sessions, skills. Sans ce volume, chaque
      # recréation de conteneur repart d'une installation vierge.
      # Docker initialise le volume avec l'uid 1000 de /data dans l'image.
      - z-cloudium-data:/data
      # Workspace : volume nommé par défaut pour que `docker compose up -d`
      # fonctionne sans préparation. Pour travailler sur de vrais fichiers,
      # commenter cette ligne et monter un dossier de l'hôte à la place
      # (après `chown 1000:1000` côté hôte, le conteneur tourne en uid 1000) :
      #   - /srv/z-cloudium/workspace:/workspace
      - z-cloudium-workspace:/workspace

    environment:
      # HOME et ZCODE_DATA_BASE_DIR pointent tous deux vers /data : les skills
      # ($HOME/.zcode/skills), les mémoires (<base>/.zcode/cli/memories) et la
      # configuration vivent dans le volume, donc persistent.
      HOME: /data
      ZCODE_DATA_BASE_DIR: /data
      ZCODE_SERVER_WORKSPACE: /workspace
      ZCODE_MODEL_TELEMETRY_ENABLED: "0"

    ## ---------- Durcissement ----------
    # Le rootfs du conteneur ne peut pas être modifié : une compromission ne
    # persiste pas, et l'outillage de l'image (node, git) ne peut pas être altéré
    # depuis l'intérieur. Les écritures légitimes passent par /data, /workspace
    # et /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    # Empêche toute élévation via binaire setuid ou fichier-capability.
    security_opt:
      - no-new-privileges:true
    # Aucune capacité : uid 1000 n'en a besoin d'aucune pour son travail.
    cap_drop:
      - ALL
    # Garde-fous de ressources (à ajuster selon la machine).
    pids_limit: 512
    mem_limit: 4g
    cpus: 2

    command:
      - --web
      - --host=0.0.0.0
      - --port=3030
      - --workspace=/workspace
      - --no-open
      # Sans authentification : acceptable uniquement sur réseau privé.
      # Pour l'activer, retirer cette ligne (le token apparaît dans les logs).
      - --no-token

volumes:
  z-cloudium-data:
  z-cloudium-workspace:
