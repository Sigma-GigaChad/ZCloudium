name: build-image

# Builds the image and publishes it to GHCR.
#
# The pins live in zcode.version, zcode.sha256 and chromium.version, and this
# workflow is one of the three places that turn them into build arguments. The
# Dockerfile refuses a build that is missing one, so no pin can be forgotten
# silently: that is what let an earlier build ship the previous runtime under
# the new tag.
#
# The Dockerfile also verifies the integrity of the runtime itself (sha256
# pinned in the repository, setuid scan) and refuses to build on a mismatch. A
# build that passes has therefore already been checked.
#
# A `smoke` job then pulls the published image into a real container and checks
# that the gateway answers, that the image carries the runtime and the browser
# its tag and its manifest claim, and that the browser MCP server was
# configured: an image is not shipped without having been started.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sigma-gigachad/z-cloudium

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      chromium: ${{ steps.version.outputs.chromium }}
    steps:
      - uses: actions/checkout@v7

      # The single place that reads the pins. `list` is what the build step
      # passes as build arguments, in the shape docker/build-push-action reads.
      - name: Read the pins
        id: version
        run: |
          tag="$(tr -d '[:space:]' < zcode.version)"
          sha="$(tr -d '[:space:]' < zcode.sha256)"
          # shellcheck source=chromium.version
          . ./chromium.version
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "chromium=${chromium_upstream}" >> "$GITHUB_OUTPUT"
          {
            echo "list<<EOF"
            echo "ZCODIUM_VERSION=${tag}"
            echo "TARBALL_URL=https://github.com/ZCodium-project/ZCodium/releases/download/${tag}/zcodium-${tag#v}.tar.gz"
            echo "TARBALL_SHA256=${sha}"
            echo "CHROMIUM_PACKAGE=${chromium_package}"
            echo "CHROMIUM_COMMON_PACKAGE=${chromium_common}"
            echo "CHROMIUM_UPSTREAM=${chromium_upstream}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Pinned runtime: ${tag} (sha256 ${sha})"
          echo "Pinned browser: chromium ${chromium_package}, upstream ${chromium_upstream}"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: ${{ steps.version.outputs.list }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The volume on /data is required: the gateway writes its session key and
      # its accounts there, and the container root filesystem is read-only.
      - name: Start the published image
        run: |
          docker run -d --name smoke \
            -p 127.0.0.1:3030:3030 \
            -v smoke-data:/data \
            --read-only --tmpfs /tmp:size=512m \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            "${{ env.IMAGE }}:${{ needs.build.outputs.version }}"

      - name: Wait for the gateway to answer
        run: |
          for i in $(seq 1 30); do
            if curl -fsSk -o /dev/null https://127.0.0.1:3030/_auth/health; then
              echo "The gateway answers after ${i} attempts."
              exit 0
            fi
            sleep 2
          done
          echo "The gateway never answered." >&2
          docker logs smoke >&2
          exit 1

      - name: Check that the interface sits behind the gateway
        run: |
          code="$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:3030/)"
          location="$(curl -sk -o /dev/null -D - https://127.0.0.1:3030/ | tr -d '\r' | grep -i '^location:')"
          echo "GET / -> ${code} ${location}"
          test "$code" = "302"
          echo "$location" | grep -q '/_auth/login'

      # The image has to be the one its tag claims. Both values are compared,
      # not printed: a printout is exactly what let a 3.14.4 tag carry a 3.14.3
      # runtime, and nobody noticed.
      - name: Check that the image carries the runtime and the browser it claims
        run: |
          runtime="$(docker exec smoke node /opt/zcodium/bin/zcode.mjs --version)"
          browser="$(docker exec smoke chromium --version)"
          echo "runtime: ${runtime}"
          echo "browser: ${browser}"
          test "${runtime}" = "${{ needs.build.outputs.version }}"
          case "${browser}" in
            *"Chromium ${{ needs.build.outputs.chromium }}"*) ;;
            *) echo "the browser in the image is not the one chromium.version pins" >&2; exit 1 ;;
          esac

      - name: Check the browser automation baked into the image
        run: |
          docker exec smoke /usr/local/bin/chrome-devtools-mcp --version
          docker exec smoke node -e '
            const config = JSON.parse(require("node:fs").readFileSync("/data/.zcode/cli/config.json", "utf8"));
            const entry = config.mcp.servers["chrome-devtools"];
            if (!entry) {
              throw new Error("the chrome-devtools server is missing from the agent configuration");
            }
            console.log("browser MCP configured:", entry.command, entry.args.join(" "));
          '

      # The panel is on in the image by default, and a default is a claim. The
      # container above was started with no environment variable at all, so this
      # is the default position: one browser for the agent and the operator, and
      # the panel behind the session.
      - name: Check that the browser panel is on by default, behind the session
        run: |
          docker logs smoke 2>&1 | grep -q "browser panel: the agent attaches to" || {
            echo "the container started with no environment variable did not start the browser for the panel" >&2
            docker logs smoke >&2
            exit 1
          }
          code="$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:3030/_browser/)"
          test "$code" = "302"
          echo "GET /_browser/ -> ${code}, which is the sign in page: the panel is behind the session"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f smoke || true
          docker volume rm smoke-data || true
