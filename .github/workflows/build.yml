name: build-image

# Builds the image and publishes it to GHCR.
#
# There is no separate "build" step to check anything: the Dockerfile verifies
# the integrity of the runtime itself (sha256 pinned in the repository, setuid
# scan) and refuses to build on a mismatch. A build that passes has therefore
# already been checked.
#
# A `smoke` job then pulls the published image into a real container and checks
# that the gateway answers and that the browser MCP server was configured: an
# image is not shipped without having been started.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sigma-gigachad/z-cloudium

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned version
        id: version
        run: |
          tag="$(tr -d '[:space:]' < zcode.version)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Pinned version: ${tag}"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The volume on /data is required: the gateway writes its session key and
      # its accounts there, and the container root filesystem is read-only.
      - name: Start the published image
        run: |
          docker run -d --name smoke \
            -p 127.0.0.1:3030:3030 \
            -v smoke-data:/data \
            --read-only --tmpfs /tmp:size=512m \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            "${{ env.IMAGE }}:${{ needs.build.outputs.version }}"

      - name: Wait for the gateway to answer
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3030/_auth/health; then
              echo "The gateway answers after ${i} attempts."
              exit 0
            fi
            sleep 2
          done
          echo "The gateway never answered." >&2
          docker logs smoke >&2
          exit 1

      - name: Check that the interface sits behind the gateway
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3030/)"
          location="$(curl -s -o /dev/null -D - http://127.0.0.1:3030/ | tr -d '\r' | grep -i '^location:')"
          echo "GET / -> ${code} ${location}"
          test "$code" = "302"
          echo "$location" | grep -q '/_auth/login'

      - name: Check the browser automation baked into the image
        run: |
          docker exec smoke chromium --version
          docker exec smoke /usr/local/bin/chrome-devtools-mcp --version
          docker exec smoke node -e '
            const config = JSON.parse(require("node:fs").readFileSync("/data/.zcode/cli/config.json", "utf8"));
            const entry = config.mcp.servers["chrome-devtools"];
            if (!entry) {
              throw new Error("the chrome-devtools server is missing from the agent configuration");
            }
            console.log("browser MCP configured:", entry.command, entry.args.join(" "));
          '

      - name: Cleanup
        if: always()
        run: |
          docker rm -f smoke || true
          docker volume rm smoke-data || true
