name: build-image

# Builds the image and publishes it to GHCR.
#
# The published image is the PRODUCT: the runtime is compiled from the pinned
# ZCodium revision with the patch series in patches/, because the remote
# workspace features (Remote SSH from the web client, Cloud Environments) do
# not exist in the vendor tarball. Dockerfile.from-source carries the same
# gateway, entrypoint and probe as the precompiled path, refuses an empty patch
# set, applies the series with a check pass, exercises the RPC bridge over two
# in-memory hops, and greps one server route and one web string in the
# extracted artefacts — a build that silently missed the patches cannot exist.
#
# The version still comes from zcode.version, and the runtime version the image
# carries is compared against it in the smoke job; the pin is the source
# revision, labelled with its exact commit.
#
# A `smoke` job then pulls the published image into a real container and checks
# that the gateway answers and that the interface sits behind it: an image is
# not shipped without having been started.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sigma-gigachad/z-cloudium

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # The single place that reads the pins. The version tag is what the build
      # passes as ZCODE_REF; the exact commit is resolved for the revision
      # label, the same way build.sh --from-source does.
      - name: Read the pins
        id: version
        run: |
          tag="$(tr -d '[:space:]' < zcode.version)"
          sha="$(tr -d '[:space:]' < zcode.sha256)"
          if [ -z "$(ls patches/*.patch 2>/dev/null)" ]; then
            echo "patches/ carries no .patch file; the from-source build would be refused anyway." >&2
            exit 1
          fi
          commit="$(git ls-remote https://github.com/ZCodium-project/ZCodium.git "refs/tags/${tag}^{}" | awk '{print $1}')"
          commit="${commit:-$(git ls-remote https://github.com/ZCodium-project/ZCodium.git "refs/tags/${tag}" | awk '{print $1}')}"
          if [ -z "$commit" ]; then
            echo "Tag ${tag} not found on ZCodium-project/ZCodium." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          {
            echo "list<<EOF"
            echo "ZCODE_REF=${tag}"
            echo "ZCODE_COMMIT=${commit}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Pinned runtime: ${tag} @ ${commit} (sha256 pin ${sha} still guards the precompiled path)"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.from-source
          push: true
          build-args: ${{ steps.version.outputs.list }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The volumes are required: the volume pre-check refuses to start a
      # container whose /data or /workspace is not persisted, and the gateway
      # writes its session key and its accounts on /data. The container root
      # filesystem is read-only.
      - name: Start the published image
        run: |
          docker run -d --name smoke \
            -p 127.0.0.1:3030:3030 \
            -v smoke-data:/data \
            -v smoke-ws:/workspace \
            --read-only --tmpfs /tmp:size=512m \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            "${{ env.IMAGE }}:${{ needs.build.outputs.version }}"

      - name: Wait for the gateway to answer
        run: |
          for i in $(seq 1 30); do
            if curl -fsSk -o /dev/null https://127.0.0.1:3030/_auth/health; then
              echo "The gateway answers after ${i} attempts."
              exit 0
            fi
            sleep 2
          done
          echo "The gateway never answered." >&2
          docker logs smoke >&2
          exit 1

      # The pre-check is itself part of the product: a container launched
      # without volumes must refuse to start, with the fix in the message.
      - name: Check that the volume pre-check refuses an unmounted container
        run: |
          set -o pipefail
          if docker run --rm --name smoke-novol \
            --read-only --tmpfs /tmp:size=512m \
            "${{ env.IMAGE }}:${{ needs.build.outputs.version }}" 2>&1 | tee smoke-novol.log; then
            echo "A container without volumes started: the pre-check did not run." >&2
            exit 1
          fi
          grep -q "refusing to start" smoke-novol.log
          grep -q "throwaway anonymous volume" smoke-novol.log
          echo "The pre-check refused the unmounted container, with the fix in the message."
          rm -f smoke-novol.log

      - name: Check that the interface sits behind the gateway
        run: |
          code="$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:3030/)"
          location="$(curl -sk -o /dev/null -D - https://127.0.0.1:3030/ | tr -d '\r' | grep -i '^location:')"
          echo "GET / -> ${code} ${location}"
          test "$code" = "302"
          echo "$location" | grep -q '/_auth/login'

      # The image has to be the one its tag claims. Both values are compared,
      # not printed: a printout is exactly what let a 3.14.4 tag carry a 3.14.3
      # runtime, and nobody noticed.
      - name: Check that the image carries the runtime it claims
        run: |
          runtime="$(docker exec smoke node /opt/zcodium/bin/zcode.mjs --version)"
          echo "runtime: ${runtime}"
          test "${runtime}" = "${{ needs.build.outputs.version }}"

      # The published image must be the patched one: the remote workspace
      # features are the reason the from-source path exists, and the vendor
      # tarball does not carry them. Two markers, one on each side.
      - name: Check that the image carries the patch series
        run: |
          server="$(docker exec smoke grep -c 'api/stage-attachment' /opt/zcodium/server/entry-http.js)"
          web="$(docker exec smoke sh -c 'grep -l api/connect-remote /opt/zcodium/web/assets/*.js | head -1')"
          echo "server markers: ${server}, web marker: ${web}"
          test "${server}" -ge 1
          test -n "${web}"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f smoke smoke-novol || true
          docker volume rm smoke-data smoke-ws || true
