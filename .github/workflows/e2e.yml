name: e2e

# Drives the real interface in a real browser, against a real container started
# from the image built from this commit.
#
# The build workflow's smoke job proves that the gateway answers. It cannot see
# a broken wizard, a session cookie that authorises nothing, or an upgrade
# proxy that lets an anonymous client through, because none of those are
# visible to a plain HTTP probe. This workflow is the one that would catch
# them.
#
# It builds its own image rather than pulling one: the point is to test the code
# in the commit being pushed. Every job here reads the same pin files as
# build.yml and passes them as build arguments, because the Dockerfile refuses
# to build without them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: z-cloudium-e2e:local
  PORT: "3032"
  # Names the container and its two volumes, so a run never touches another
  # container on the runner.
  PREFIX: zcloudium-e2e-ci

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Same pins as build.yml, same single reading point. The image under test
      # is the product build: the runtime compiled from the pinned revision with
      # the patch series, because the remote workspace features under test do
      # not exist in the vendor tarball.
      - name: Read the pins
        id: pins
        run: |
          tag="$(tr -d '[:space:]' < zcode.version)"
          if [ -z "$(ls patches/*.patch 2>/dev/null)" ]; then
            echo "patches/ carries no .patch file; the from-source build would be refused anyway." >&2
            exit 1
          fi
          commit="$(git ls-remote https://github.com/ZCodium-project/ZCodium.git "refs/tags/${tag}^{}" | awk '{print $1}')"
          commit="${commit:-$(git ls-remote https://github.com/ZCodium-project/ZCodium.git "refs/tags/${tag}" | awk '{print $1}')}"
          {
            echo "list<<EOF"
            echo "ZCODE_REF=${tag}"
            echo "ZCODE_COMMIT=${commit}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Runtime under test: ${tag} @ ${commit}"

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.from-source
          push: false
          load: true
          build-args: ${{ steps.pins.outputs.list }}
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install the suite
        working-directory: e2e
        run: npm ci

      # Chromium only: the suite runs on it, and nothing else is needed.
      - name: Install the browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Starts a container from the image just built, with a clean data volume
      # (the wizard runs once per volume, so a clean one is what makes the first
      # connection testable) and the same hardening flags as the compose files.
      # Through bash, so the step does not depend on the checkout preserving the
      # executable bit of the script.
      - name: Start the container
        working-directory: e2e/scripts
        run: bash ./start-container.sh "$IMAGE" "$PORT" "$PREFIX"

      - name: Run the suite
        working-directory: e2e
        env:
          E2E_BASE_URL: https://127.0.0.1:${{ env.PORT }}
        run: npx playwright test

      # The report on its own answers "what failed"; the screenshots, videos and
      # traces of the failed tests answer "why".
      - name: Upload the report and the traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Stop the container
        if: always()
        working-directory: e2e/scripts
        run: bash ./stop-container.sh "$PREFIX"
