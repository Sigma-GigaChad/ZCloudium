name: upstream-check

# The versioning of this repository rests on an upstream release pinned by hand
# (zcode.version plus zcode.sha256). Without a watch, the pin never moves: this
# workflow opens an issue when a new release exists.
#
# It modifies nothing and builds nothing. The bump stays an explicit decision
# (`./check-upstream.sh --bump` locally).

on:
  schedule:
    # Every Monday at 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare with the latest upstream release
        id: check
        run: |
          current="$(tr -d '[:space:]' < zcode.version)"
          latest="$(curl -fsSL \
            https://api.github.com/repos/ZCodium-project/ZCodium/releases/latest \
            | grep -o '"tag_name": *"[^"]*"' \
            | head -n 1 \
            | cut -d '"' -f 4)"

          if [ -z "$latest" ]; then
            echo "Cannot read the latest upstream release." >&2
            exit 1
          fi

          echo "Pinned: ${current} / latest release: ${latest}"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          else
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue when an update is available
        if: steps.check.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing="$(gh issue list --state open --search 'in:title Upstream update available' \
            --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            echo "An update issue is already open."
            exit 0
          fi

          gh issue create \
            --title "Upstream update available: ${{ steps.check.outputs.latest }}" \
            --body "$(cat <<EOF
          Upstream release available: **${{ steps.check.outputs.latest }}** (pinned: ${{ steps.check.outputs.current }}).

          \`\`\`bash
          ./check-upstream.sh --bump     # updates zcode.version and zcode.sha256
          ./check-upstream.sh --build    # bump, then rebuild locally
          \`\`\`

          The bump fetches the official sha256 of the release. Read the diff before
          pushing: the runtime is third party code, and the image is rebuilt
          automatically by the \`build-image\` workflow on the next push to \`main\`.
          EOF
          )"
