<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Phase 0 fixture</title>
</head>
<body>
  <h1 id="heading">Phase 0 fixture</h1>
  <p>page load id: <strong id="loadid">?</strong> (a reload changes it)</p>
  <p>viewport: <strong id="size">?</strong></p>
  <p>clock: <strong id="clock">?</strong> (a freeze means the picture stopped updating)</p>
  <p>
    <label for="typed">Type here</label>
    <input id="typed" type="text" />
  </p>
  <p>typed so far: <strong id="typedmirror">(nothing)</strong></p>
  <p><button id="target" type="button">Pick me</button></p>
  <script>
    document.getElementById("loadid").textContent = Math.random().toString(36).slice(2, 8);
    function report() {
      const mobile = window.matchMedia("(max-width: 500px)").matches;
      document.getElementById("size").textContent =
        window.innerWidth + "x" + window.innerHeight + " dpr=" + window.devicePixelRatio + " narrow=" + mobile;
    }
    report();
    window.addEventListener("resize", report);
    document.getElementById("typed").addEventListener("input", (event) => {
      document.getElementById("typedmirror").textContent = event.target.value || "(nothing)";
      document.title = "typed: " + event.target.value;
    });
    setInterval(() => {
      document.getElementById("clock").textContent = new Date().toLocaleTimeString();
    }, 500);
  </script>
</body>
</html>
